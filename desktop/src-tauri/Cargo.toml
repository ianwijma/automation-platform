[package]
name = "automation-platform-desktop"
version = "0.1.0"
description = "Automation Platform Desktop Shell"
authors = ["Ian Wijma"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

flate2 = "1"
sha2 = "0.10"
