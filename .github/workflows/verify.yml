name: Verify Linux platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CI: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install native build and disposable desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev xvfb xfonts-base xdotool wmctrl maim imagemagick tesseract-ocr
      - run: bun install --frozen-lockfile
      - run: bun run scripts/ocr.ts
      - run: bun run check
      - run: cargo test --locked --manifest-path desktop/bridge/Cargo.toml
      - run: cargo fmt --check --manifest-path desktop/bridge/Cargo.toml
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --reporter=line
      - run: bun run test:desktop
      - name: Build desktop packages and portable runtime
        run: bun run --cwd desktop build --bundles deb,appimage
      - run: bun run test:portable
      - run: bun run scripts/package-smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-unsigned
          path: |
            dist/ap
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: test-results/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t automation-platform:test .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun run scripts/container-smoke.ts automation-platform:test
